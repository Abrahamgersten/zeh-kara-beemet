<style>
  :root { --bg:#0f8793; --ink:#ffffff; --btn:#25d366; --btn-ink:#06351a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:"Heebo",system-ui,sans-serif; text-align:center; padding:24px; }
  main { max-width:420px; }

<body>
<main>
  <img src="og.jpg" alt="סיפור לפני השינה - זה קרה באמת" width="160" height="160">
  <h1>סיפור לפני השינה - זה קרה באמת</h1>
  <p id="msg">מעבירים אתכם לקבוצת הוואטסאפ...</p>
  <a class="btn" id="go" href="https://chat.whatsapp.com/GIoja07vZquHA8DWlDt6M1">הצטרפות לקבוצה</a>
</main>
<script>
(function () {
  // קישור גיבוי: אם השרת לא עונה, מפנים לקבוצה הראשונה במקום להיתקע.
  var FALLBACK = "https://chat.whatsapp.com/GIoja07vZquHA8DWlDt6M1";
  var SUPABASE = "https://nuadpewhrhpdgznbbqbs.supabase.co";
  var KEY = "sb_publishable_AcpmlZnxKM4yJxr1OsoSjw_CG6Kt2pz";
  var go = document.getElementById("go");
  var done = false;
  function finish(url) {
    if (done) return;
    done = true;
    if (!/^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9]+$/.test(url)) url = FALLBACK;
    go.href = url;
    location.replace(url);
  }
  var ctl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); finish(FALLBACK); }, 3000);
  fetch(SUPABASE + "/rest/v1/rpc/get_join_target", {
    method: "POST",
    headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
    body: "{}",
    cache: "no-store",
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) { return r.ok ? r.json() : FALLBACK; })
    .then(function (u) { clearTimeout(timer); finish(typeof u === "string" ? u : FALLBACK); })
    .catch(function () { clearTimeout(timer); finish(FALLBACK); });
})();
</script>
