<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>התחברות - זה קרה באמת</title>
<meta name="description" content="התחברות לאתר זה קרה באמת - עם אותו אימייל שנרשמתם בו למנוי.">
<meta name="theme-color" content="#0f8793">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="alternate" hreflang="he" href="./login.html">
<link rel="alternate" hreflang="en" href="en/login.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">

<div id="install-banner" class="install-banner" hidden>
  <div class="install-banner__icon">
    <img src="icons/icon-192.png" alt="" width="44" height="44">
  </div>
  <div class="install-banner__text">
    <strong id="install-banner-title">התקינו את האפליקציה</strong>
    <span id="install-banner-sub">גשו לכל התכנים בלחיצה אחת, ישר מהמסך הראשי</span>
  </div>
  <button id="install-banner-action" class="install-banner__btn" type="button">התקנה</button>
  <button id="install-banner-close" class="install-banner__close" type="button" aria-label="סגירה">✕</button>
</div>

<header class="site-header">
  <div class="site-header__inner">
    <a href="index.html" class="brand">
      <img class="brand__mark" src="icons/brand-mark.png" alt="" width="40" height="40">
      <span class="brand__name">זה קרה באמת</span>
    </a>
    <nav class="site-nav" aria-label="ניווט">
      <a href="en/login.html" class="lang-switch">English</a>
    </nav>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title" id="auth-title">התחברות</h1>
    <p class="auth-card__note" id="auth-paid-note" hidden>התשלום התקבל! עכשיו רק צריך להתחבר - <strong>עם אותו אימייל</strong> ששילמת בו.</p>
    <p class="auth-card__sub">התחברו עם אותו אימייל שנרשמתם בו למנוי.</p>

    <button id="google-btn" class="btn btn--primary auth-card__google" type="button">
      <span aria-hidden="true">🔑</span> התחברות עם Google
    </button>

    <div class="auth-card__divider"><span>או</span></div>

    <form id="magic-form" class="auth-card__form">
      <label for="magic-email" class="auth-card__label">אימייל</label>
      <input id="magic-email" name="email" type="email" required placeholder="you@example.com" class="auth-card__input" autocomplete="email">
      <button type="submit" class="btn btn--outline">שליחת קישור התחברות</button>
    </form>

    <p id="auth-status" class="auth-card__status" role="status" aria-live="polite"></p>

    <p class="auth-card__footer">עדיין לא נרשמתם? <a href="offer.html">להצטרפות למנוי</a></p>
  </div>
</main>

<script type="module">
  import { isSupabaseConfigured, getSession, onAuthStateChange, signInWithGoogle, signInWithMagicLink, fetchEntitlement, isEntitled, revealPage } from "./js/auth.js";

  const INDEX_URL = "index.html";
  const OFFER_URL = "offer.html";
  const statusEl = document.getElementById("auth-status");
  const paidNote = document.getElementById("auth-paid-note");

  if (new URLSearchParams(location.search).get("paid") === "1") paidNote.hidden = false;

  if (!isSupabaseConfigured()) {
    statusEl.textContent = "המערכת עדיין לא הוקמה - זה דף תצוגה מקדימה בלבד.";
    revealPage();
  } else {
    async function checkAndMaybeRedirect() {
      const session = await getSession();
      if (!session) { revealPage(); return; }
      statusEl.textContent = "בודקים את המנוי שלכם...";
      const row = await fetchEntitlement();
      if (isEntitled(row)) {
        window.location.replace(INDEX_URL);
      } else {
        statusEl.textContent = "לא מצאנו מנוי פעיל עבור " + (row ? row.email : session.user.email) + ". אם שילמת עם כתובת אחרת, כתבו לנו ונתקן.";
        revealPage();
      }
    }
    checkAndMaybeRedirect();
    onAuthStateChange(() => checkAndMaybeRedirect());
  }

  // מאזינים מחוברים תמיד (גם כשהמערכת עוד לא מוגדרת) - כדי שהטופס/הכפתור
  // לעולם לא יבצעו submit דפדפני טבעי (רענון עם ?email=... בכתובת).
  document.getElementById("google-btn").addEventListener("click", async () => {
    if (!isSupabaseConfigured()) return;
    statusEl.textContent = "מעבירים לגוגל...";
    const { error } = await signInWithGoogle(location.href.split("?")[0]);
    if (error) statusEl.textContent = "שגיאה: " + error.message;
  });

  document.getElementById("magic-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!isSupabaseConfigured()) return;
    const email = document.getElementById("magic-email").value.trim();
    statusEl.textContent = "שולחים קישור...";
    const { error } = await signInWithMagicLink(email, location.href.split("?")[0]);
    statusEl.textContent = error ? "שגיאה: " + error.message : "שלחנו קישור התחברות ל-" + email + " - בדקו את תיבת הדואר.";
  });
</script>
<script src="js/install-banner.js" defer></script>
</body>
</html>
