<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שיחות - זה קרה באמת</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f8793">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* תיבת השיחות של המספר העסקי (אברהם, 2026-10-27): כל מי שכתב לבוטים, ותשובה ממנו ישירות, בלי טוקנים ובלי המחשב.
     קריאה: admin_inbox_list / admin_inbox_thread / admin_inbox_mark (מיגרציה 0021). שליחה ותמונות: פונקציית הקצה wa-inbox.
     בטלפון: רשימה או שיחה (#מספר בכתובת). במסך רחב: שתיהן זו לצד זו. */
  body.ib-body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  .ib-body .site-header { position: static; flex: none; }
  .ib-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .btn--sm { padding: 0.45em 1em; font-size: 0.86rem; }

  .ib { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; max-width: 1200px; width: 100%; margin: 0 auto; }
  .ib[hidden] { display: none; }

  /* רשימת השיחות */
  .ib-list { display: flex; flex-direction: column; min-height: 0; background: var(--sand-50); border-inline-end: 1px solid color-mix(in srgb, var(--teal-200) 60%, var(--sand-200)); }
  .ib-list__top { padding: 0.9rem 0.9rem 0.6rem; display: grid; gap: 0.55rem; }
  .ib-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 4px 14px -10px rgba(7, 34, 41, 0.35); }
  .ib-tabs button { border: 0; background: transparent; font: 600 0.9rem var(--font-body); color: var(--teal-ink); padding: 0.5em 0.6em; border-radius: 999px; cursor: pointer; }
  .ib-tabs button[aria-pressed="true"] { background: var(--teal-800); color: #fff; }
  .ib-count { display: inline-block; min-width: 1.5em; padding: 0 0.4em; margin-inline-start: 0.25em; border-radius: 999px; background: var(--gold-500); color: var(--ink); font-size: 0.78rem; line-height: 1.5; }
  .ib-search { width: 100%; box-sizing: border-box; font: 400 0.95rem var(--font-body); padding: 0.55em 0.9em; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--teal-200) 70%, var(--sand-200)); background: #fff; color: var(--ink); }
  .ib-hint { margin: 0; font-size: 0.78rem; color: var(--ink-soft); line-height: 1.5; min-height: 1.2em; }
  .ib-hint.is-error { color: #a33a3a; }
  .ib-convs { list-style: none; margin: 0; padding: 0 0.5rem 0.5rem; overflow-y: auto; flex: 1; min-height: 0; }
  .ib-conv { display: grid; grid-template-columns: 1fr auto; gap: 0.15em 0.6em; width: 100%; text-align: start; border: 0; background: transparent; padding: 0.7em 0.7em; border-radius: var(--radius-sm); cursor: pointer; font: inherit; color: inherit; }
  .ib-conv:hover { background: color-mix(in srgb, var(--teal-200) 35%, #fff); }
  .ib-conv[aria-current="true"] { background: var(--teal-200); }
  .ib-conv__name { font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-conv__time { font-size: 0.75rem; color: var(--ink-soft); white-space: nowrap; align-self: center; }
  .ib-conv__prev { font-size: 0.85rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-conv__tags { display: flex; gap: 0.3em; align-items: center; justify-content: flex-end; }
  .ib-conv.is-unread .ib-conv__name::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-600); margin-inline-start: 0.4em; vertical-align: middle; }
  .ib-chip { font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 0.1em 0.45em; white-space: nowrap; }
  .ib-chip--reply { background: var(--gold-100); color: var(--gold-ink); }
  .ib-chip--closed { background: #eceae4; color: var(--ink-soft); }
  .ib-empty-list { color: var(--ink-soft); font-size: 0.9rem; padding: 1rem; line-height: 1.6; }
  .ib-foot { margin: 0; padding: 0.6rem 0.9rem 0.8rem; font-size: 0.82rem; color: var(--ink-soft); }
  .ib-foot a { color: var(--teal-ink); }

  /* שיחה */
  .ib-thread { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: color-mix(in srgb, var(--sand-200) 30%, var(--sand-50)); }
  .ib-thread__inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .ib-thread__inner[hidden] { display: none; }
  .ib-pick { margin: auto; color: var(--ink-soft); padding: 2rem; text-align: center; }
  .ib-th { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.9rem; background: var(--sand-50); border-bottom: 1px solid color-mix(in srgb, var(--teal-200) 60%, var(--sand-200)); }
  .ib-back { display: none; border: 0; background: transparent; font-size: 1.4rem; color: var(--teal-ink); cursor: pointer; padding: 0.2em 0.35em; border-radius: 8px; }
  .ib-th__who { flex: 1; min-width: 0; }
  .ib-th__who h1 { font: 700 1.05rem var(--font-body); color: var(--teal-heading); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-th__who p { margin: 0.1em 0 0; font-size: 0.8rem; color: var(--ink-soft); }
  .ib-th__who a { color: inherit; }
  .ib-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 0.9rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .ib-day { align-self: center; font-size: 0.75rem; color: var(--ink-soft); background: #fff; border-radius: 999px; padding: 0.15em 0.8em; margin: 0.6rem 0 0.3rem; box-shadow: 0 2px 8px -6px rgba(7, 34, 41, 0.4); }
  .ib-msg { max-width: min(78%, 34rem); padding: 0.5em 0.75em 0.35em; border-radius: 14px; box-shadow: 0 2px 8px -6px rgba(7, 34, 41, 0.45); font-size: 0.93rem; line-height: 1.5; overflow-wrap: anywhere; }
  .ib-msg--in { align-self: flex-start; background: #fff; border-start-start-radius: 4px; }
  .ib-msg--me { align-self: flex-end; background: var(--teal-200); border-start-end-radius: 4px; }
  .ib-msg--bot { align-self: flex-end; background: var(--gold-100); border-start-end-radius: 4px; }
  .ib-msg__who { display: block; font-size: 0.72rem; font-weight: 700; color: var(--gold-ink); margin-bottom: 0.15em; }
  .ib-msg__text { white-space: pre-wrap; }
  .ib-msg__text a { color: var(--teal-ink); }
  .ib-msg__meta { display: flex; justify-content: flex-end; gap: 0.35em; font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.15em; }
  .ib-tick--read { color: #1f8fd6; }
  .ib-tick--failed { color: #a33a3a; font-weight: 700; }
  .ib-msg img { display: block; max-width: 100%; max-height: 260px; border-radius: 10px; margin: 0.2em 0 0.3em; }
  .ib-msg audio, .ib-msg video { display: block; max-width: 100%; margin: 0.2em 0; }
  .ib-media-btn { border: 1px solid var(--teal-800); background: #fff; color: var(--teal-ink); border-radius: 999px; font: 600 0.82rem var(--font-body); padding: 0.3em 0.9em; cursor: pointer; margin-top: 0.2em; }
  .ib-sys { align-self: center; max-width: 90%; text-align: center; font-size: 0.76rem; color: var(--ink-soft); background: color-mix(in srgb, #fff 70%, transparent); border-radius: 8px; padding: 0.2em 0.7em; }
  .ib-sys--fail { color: #8a2d2d; background: #fbe4e4; }

  .ib-compose { padding: 0.55rem 0.9rem calc(0.7rem + env(safe-area-inset-bottom)); background: var(--sand-50); border-top: 1px solid color-mix(in srgb, var(--teal-200) 60%, var(--sand-200)); display: grid; gap: 0.35rem; }
  .ib-window { margin: 0; font-size: 0.78rem; color: var(--ink-soft); line-height: 1.5; }
  .ib-window.is-closed { color: #8a3b12; }
  .ib-compose__row { display: flex; gap: 0.5rem; align-items: flex-end; }
  .ib-compose textarea { flex: 1; resize: none; font: 400 0.98rem/1.45 var(--font-body); padding: 0.6em 0.9em; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--teal-200) 70%, var(--sand-200)); background: #fff; color: var(--ink); max-height: 9.5em; min-height: 2.75em; box-sizing: border-box; }
  .ib-compose textarea:disabled { background: #f1efe9; }
  .ib-send { flex: none; width: 2.75em; height: 2.75em; border-radius: 50%; border: 0; background: var(--teal-800); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .ib-send:disabled { background: #b9c6c8; cursor: not-allowed; }
  .ib-send svg { width: 1.2em; height: 1.2em; transform: scaleX(-1); }

  .ib button:focus-visible, .ib a:focus-visible, .ib-search:focus-visible, .ib-compose textarea:focus-visible, .ib-msgs:focus-visible { outline: 3px solid var(--gold-300); outline-offset: 2px; }
  .ib-denied { text-align: center; padding: 4rem 1.25rem; color: var(--ink-soft); }

  @media (max-width: 820px) {
    .ib { grid-template-columns: 1fr; }
    .ib-list { border-inline-end: 0; }
    .ib.is-thread .ib-list { display: none; }
    .ib:not(.is-thread) .ib-thread { display: none; }
    .ib-back { display: block; }
    .ib-msg { max-width: 86%; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>
</head>
<body class="auth-pending ib-body">

<header class="site-header">
  <div class="site-header__inner">
    <a href="admin.html" class="brand">
      <img class="brand__mark" src="icons/brand-mark.png" alt="" width="40" height="40">
      <span class="brand__name">זה קרה באמת · שיחות</span>
    </a>
  </div>
</header>

<main class="ib" id="ib" hidden>
  <section class="ib-list" aria-label="רשימת השיחות">
    <div class="ib-list__top">
      <div class="ib-tabs" role="group" aria-label="אילו שיחות להציג">
        <button type="button" data-filter="open" aria-pressed="true">דורשים תשובה<span class="ib-count" id="open-count" hidden></span></button>
        <button type="button" data-filter="all" aria-pressed="false">כל השיחות</button>
      </div>
      <label for="search" class="ib-sr">חיפוש לפי שם או מספר</label>
      <input type="search" class="ib-search" id="search" placeholder="חיפוש שם או מספר" autocomplete="off">
      <p class="ib-hint" id="list-status" role="status"></p>
    </div>
    <ul class="ib-convs" id="convs"></ul>
    <p class="ib-foot"><a href="bots.html">לדוח הבוטים</a> · <a href="admin.html">לניהול</a></p>
  </section>

  <section class="ib-thread" aria-label="השיחה">
    <p class="ib-pick" id="pick">בחרו שיחה מהרשימה.</p>
    <div class="ib-thread__inner" id="thread" hidden>
      <div class="ib-th">
        <button type="button" class="ib-back" id="back" aria-label="חזרה לרשימה">→</button>
        <div class="ib-th__who">
          <h1 id="th-name"></h1>
          <p id="th-meta"></p>
        </div>
        <button type="button" class="btn btn--outline btn--sm" id="mark" hidden>סימון כטופל</button>
      </div>
      <div class="ib-msgs" id="msgs" tabindex="0" aria-label="ההודעות בשיחה"></div>
      <form class="ib-compose" id="compose">
        <p class="ib-window" id="window"></p>
        <div class="ib-compose__row">
          <label for="reply" class="ib-sr">התשובה שלך</label>
          <textarea id="reply" rows="1" placeholder="כתבו תשובה..." enterkeyhint="send"></textarea>
          <button type="submit" class="ib-send" id="send" aria-label="שליחה">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
          </button>
        </div>
        <p class="ib-hint" id="send-status" role="status"></p>
      </form>
    </div>
  </section>
</main>

<div id="denied" class="ib-denied" hidden><p>אין לך גישה לעמוד הזה.</p></div>

<script type="module">
  import { getSupabaseClient, getSession, revealPage } from "./js/auth.js";
  import { SUPABASE_URL } from "./js/supabase-config.js";

  const FN = SUPABASE_URL + "/functions/v1/wa-inbox";
  const DAY = 24 * 60 * 60 * 1000;
  const $ = (id) => document.getElementById(id);
  let supabase;
  let filter = "open";
  let rows = [];
  let current = null;        // wa_id of the open conversation
  let thread = null;         // its last admin_inbox_thread answer
  let skew = 0;              // server clock minus this device's clock
  let sending = false;
  let fromList = false;      // the conversation was opened from the list (so "back" can go back in history)
  const mediaCache = new Map(); // media_id -> { url, type }

  const FLOWS = { diamond: "💎 אשמח לסיפור", promo: "🏝️ אי היהלומים", rec: "🎧 הקלטה" };
  const STEPS = {
    diamond: { request: "ביקשו את הסיפור", intro: "נשלחו הקישור לסיפור ובקשת הסטטוס", offer: "", yes: "הסכימו לשתף", no: "לא הסכימו", rest: "נשלחו הפלייר וההודעה הקולית", other: "ענו משהו אחר" },
    promo: { request: "פנו (אי היהלומים)", intro: "נשלחו הקישור לסיפור וההזמנה לקבוצה", offer: "נשלחה הצעת החוברת", yes: "ביקשו את החוברת", no: "לא כרגע", rest: "נשלחו הפלייר לסטטוס והחוברת" },
    rec: { request: "ביקשו הקלטה", intro: "נשלחו התמונה וההקלטה", offer: "נשלחה שאלת הסטטוס", yes: "הסכימו לשתף", no: "לא הסכימו", rest: "נשלחו התמונה והמלל לסטטוס", other: "ענו משהו אחר" },
  };
  const IN_KIND = { image: "📷 תמונה", audio: "🎤 הקלטה", video: "🎬 סרטון", document: "📄 קובץ", sticker: "מדבקה", reaction: "תגובה באימוג'י", unsupported: "הודעה שוואטסאפ לא מעביר לבוטים (למשל סקר)", location: "📍 מיקום", contacts: "👤 איש קשר" };

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const linkify = (t) => esc(t).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const phone = (w) => (/^972\d{8,9}$/.test(w) ? "0" + w.slice(3).replace(/^(\d{2})(\d{3})(\d+)$/, "$1-$2-$3") : "+" + w);
  const now = () => Date.now() + skew;
  const time = (d) => new Date(d).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  const dayKey = (d) => new Date(d).toLocaleDateString("he-IL");
  function when(d) {
    const t = new Date(d), n = new Date(now());
    if (t.toDateString() === n.toDateString()) return time(d);
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (t.toDateString() === y.toDateString()) return "אתמול";
    return t.toLocaleDateString("he-IL", { day: "numeric", month: "numeric" });
  }
  function dayLabel(d) {
    const t = new Date(d), n = new Date(now());
    if (t.toDateString() === n.toDateString()) return "היום";
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (t.toDateString() === y.toDateString()) return "אתמול";
    return t.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "numeric" });
  }
  function left(lastIn) {
    const ms = Date.parse(lastIn) + DAY - now();
    if (ms <= 0) return null;
    const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
    return { ms, short: h ? `עוד ${h} ש'` : `עוד ${m} דק'`, long: h ? `${h} שעות${m ? ` ו-${m} דקות` : ""}` : `${m} דקות` };
  }
  const nameOf = (r) => r.name || phone(r.wa_id);
  const preview = (r) => (r.last_in_kind === "text" ? r.last_in_body : r.last_in_kind === "interactive" ? "🔘 " + (r.last_in_body || "") : IN_KIND[r.last_in_kind] || "הודעה") || "";

  // ---------- רשימה ----------
  async function loadList() {
    const { data, error } = await supabase.rpc("admin_inbox_list", { p_filter: filter, p_days: 30 });
    const st = $("list-status");
    if (error) { st.textContent = "לא הצלחתי לטעון את השיחות. אנסה שוב בעוד רגע."; st.classList.add("is-error"); return; }
    st.classList.remove("is-error");
    skew = Date.parse(data.now) - Date.now();
    rows = data.rows || [];
    const c = $("open-count");
    c.hidden = !data.open_count; c.textContent = data.open_count || "";
    document.title = (data.open_count ? `(${data.open_count}) ` : "") + "שיחות - זה קרה באמת";
    st.textContent = "עודכן ב-" + time(now());
    renderList();
  }

  function renderList() {
    const q = $("search").value.trim().replace(/[-\s]/g, "");
    const shown = rows.filter((r) => !q || (r.name || "").includes($("search").value.trim()) || r.wa_id.includes(q.replace(/^0/, "972")) || r.wa_id.includes(q));
    const ul = $("convs");
    if (!shown.length) {
      ul.innerHTML = `<li class="ib-empty-list">${q ? "אין שיחות שמתאימות לחיפוש." : filter === "open" ? "אין כרגע הודעות שמחכות לתשובה. 🙂<br>מה שהבוט לא יודע לענות עליו יופיע כאן." : "אין שיחות ב-30 הימים האחרונים."}</li>`;
      return;
    }
    ul.innerHTML = shown.map((r) => {
      const w = left(r.last_in_at);
      const tags = [
        r.needs_reply && w ? `<span class="ib-chip ib-chip--reply">${w.short}</span>` : "",
        r.needs_reply && !w ? `<span class="ib-chip ib-chip--closed">החלון נסגר</span>` : "",
        (r.flows || []).map((f) => (FLOWS[f] || "").split(" ")[0]).join(""),
      ].join(" ");
      return `<li><button type="button" class="ib-conv${r.unread ? " is-unread" : ""}" data-wa="${esc(r.wa_id)}" aria-current="${r.wa_id === current}">
        <span class="ib-conv__name">${esc(nameOf(r))}</span><span class="ib-conv__time">${when(r.last_in_at)}</span>
        <span class="ib-conv__prev">${esc(preview(r))}</span><span class="ib-conv__tags">${tags}</span>
        ${r.unread ? '<span class="ib-sr">הודעה חדשה</span>' : ""}</button></li>`;
    }).join("");
  }

  // ---------- שיחה ----------
  async function openThread(wa, { quiet = false } = {}) {
    const changed = wa !== current;
    current = wa;
    $("ib").classList.add("is-thread");
    $("pick").hidden = true;
    $("thread").hidden = false;
    if (changed) { $("msgs").innerHTML = ""; $("send-status").textContent = ""; $("th-name").textContent = phone(wa); $("th-meta").textContent = ""; }
    const { data, error } = await supabase.rpc("admin_inbox_thread", { p_wa_id: wa });
    if (current !== wa) return;
    if (error || !data || !data.info) { if (!quiet) $("msgs").innerHTML = `<p class="ib-sys">לא הצלחתי לטעון את השיחה.</p>`; return; }
    skew = Date.parse(data.now) - Date.now();
    const before = thread && thread.info && thread.info.wa_id === wa ? thread.items.length : -1;
    thread = data;
    renderThread(changed || data.items.length !== before);
    for (const b of document.querySelectorAll(".ib-conv")) b.setAttribute("aria-current", String(b.dataset.wa === wa));
    if (data.info.unread) {
      await supabase.rpc("admin_inbox_mark", { p_wa_id: wa, p_action: "seen" });
      const r = rows.find((x) => x.wa_id === wa);
      if (r) { r.unread = false; renderList(); }
    }
    if (changed && !quiet && matchMedia("(min-width: 821px)").matches) $("reply").focus({ preventScroll: true });
  }

  function closeThread() {
    current = null; thread = null;
    $("ib").classList.remove("is-thread");
    $("thread").hidden = true; $("pick").hidden = false;
    renderList();
  }

  function renderThread(scrollDown) {
    const { info, items } = thread;
    $("th-name").textContent = nameOf(info);
    const flows = (info.flows || []).map((f) => FLOWS[f]).filter(Boolean).join(" · ");
    $("th-meta").innerHTML = `<a href="tel:+${esc(info.wa_id)}">${esc(phone(info.wa_id))}</a>${flows ? " · " + esc(flows) : ""}`;
    $("mark").hidden = !info.needs_reply;

    const box = $("msgs");
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    let lastDay = null;
    const html = [];
    // שלבי בוט רצופים (אותו בוט) נכנסים לשורה אחת, וכך גם הודעות שלא נמסרו ברצף
    let group = null;
    const flush = () => { if (group) html.push(groupHtml(group)); group = null; };
    for (const it of items) {
      const d = dayKey(it.at);
      if (d !== lastDay) { flush(); html.push(`<div class="ib-day">${dayLabel(it.at)}</div>`); lastDay = d; }
      if (it.t === "bot") {
        const label = (STEPS[it.flow] || {})[it.step];
        if (label === "") continue;
        if (group && group.t === "bot" && group.flow === it.flow) { group.labels.push(label || it.step); continue; }
        flush(); group = { t: "bot", flow: it.flow, labels: [label || it.step], at: it.at };
        continue;
      }
      if (it.t === "fail") {
        if (group && group.t === "fail") { group.count++; continue; }
        flush(); group = { t: "fail", count: 1, body: it.body, at: it.at };
        continue;
      }
      flush();
      html.push(itemHtml(it));
    }
    flush();
    if (!items.length) html.push(`<p class="ib-sys">אין הודעות.</p>`);
    box.innerHTML = html.join("");
    if (scrollDown || nearBottom) box.scrollTop = box.scrollHeight;
    renderWindow();
  }

  function groupHtml(g) {
    if (g.t === "bot") return `<p class="ib-sys">🤖 ${esc(FLOWS[g.flow] || g.flow)}: ${esc(g.labels.join(" ← "))} · ${time(g.at)}</p>`;
    const code = (String(g.body || "").match(/\b1\d{5}\b/) || [])[0];
    const what = g.count === 1 ? "הודעה מהבוט לא נמסרה" : `${g.count} הודעות מהבוט לא נמסרו`;
    return `<p class="ib-sys ib-sys--fail" title="${esc(g.body)}">⚠️ ${what}${code ? ` (שגיאה ${code})` : ""} · ${time(g.at)}</p>`;
  }

  function itemHtml(it) {
    if (it.t === "in") {
      let body = "";
      if (it.kind === "text") body = `<div class="ib-msg__text">${linkify(it.body)}</div>`;
      else if (it.kind === "interactive") body = `<div class="ib-msg__text">🔘 ${esc(it.body)}</div>`;
      else {
        body = `<div class="ib-msg__text">${esc(IN_KIND[it.kind] || "הודעה")}${it.body ? "\n" + linkify(it.body) : ""}</div>` + mediaHtml(it);
      }
      return `<div class="ib-msg ib-msg--in">${body}<div class="ib-msg__meta">${time(it.at)}</div></div>`;
    }
    // יוצאת: של הבוט או של אברהם
    const me = it.by === "avraham";
    const icon = { audio: "🎧 הקלטה", document: "📄 ", image: "", buttons: "", text: "" }[it.kind] ?? "";
    const img = it.media_link ? `<img src="${esc(it.media_link)}" alt="" loading="lazy">` : "";
    const text = it.kind === "audio" ? icon : icon + (it.body || "");
    const ticks = it.status === "failed" ? `<span class="ib-tick--failed" title="${esc(it.error || "")}">⚠️ לא נמסרה</span>`
      : it.status === "read" ? `<span class="ib-tick--read" aria-label="נקראה">✓✓</span>`
      : it.status === "delivered" ? `<span aria-label="נמסרה">✓✓</span>` : `<span aria-label="נשלחה">✓</span>`;
    return `<div class="ib-msg ${me ? "ib-msg--me" : "ib-msg--bot"}">${me ? "" : '<span class="ib-msg__who">🤖 הבוט</span>'}${img}${text ? `<div class="ib-msg__text">${linkify(text)}</div>` : ""}<div class="ib-msg__meta">${time(it.at)} ${ticks}</div></div>`;
  }

  function mediaHtml(it) {
    if (!["image", "audio", "video", "sticker", "document"].includes(it.kind)) return "";
    if (!it.media_id) return `<div class="ib-msg__meta">(נשלח לפני 27.10, אי אפשר להציג אותו כאן)</div>`;
    const c = mediaCache.get(it.media_id);
    if (c) return mediaTag(c, it.kind);
    const label = { image: "הצגת התמונה", sticker: "הצגת המדבקה", audio: "השמעה", video: "הצגת הסרטון", document: "פתיחת הקובץ" }[it.kind];
    return `<button type="button" class="ib-media-btn" data-media="${esc(it.media_id)}" data-kind="${esc(it.kind)}">${label}</button>`;
  }
  function mediaTag(c, kind) {
    if (c.type.startsWith("image/")) return `<img src="${c.url}" alt="${kind === "sticker" ? "מדבקה" : "תמונה שנשלחה"}">`;
    if (c.type.startsWith("audio/")) return `<audio controls src="${c.url}"></audio>`;
    if (c.type.startsWith("video/")) return `<video controls src="${c.url}"></video>`;
    return `<a href="${c.url}" target="_blank" rel="noopener">פתיחת הקובץ</a>`;
  }
  async function loadMedia(btn) {
    btn.disabled = true; btn.textContent = "טוען...";
    try {
      const r = await fetch(FN + "?media=" + encodeURIComponent(btn.dataset.media), { headers: await authHeaders() });
      if (!r.ok) throw new Error(r.status === 404 ? "gone" : "fail");
      const blob = await r.blob();
      const c = { url: URL.createObjectURL(blob), type: blob.type || r.headers.get("content-type") || "" };
      mediaCache.set(btn.dataset.media, c);
      btn.outerHTML = mediaTag(c, btn.dataset.kind);
    } catch (e) {
      btn.outerHTML = `<div class="ib-msg__meta">${e.message === "gone" ? "וואטסאפ כבר לא שומר את הקובץ (עברו 30 יום)." : "לא הצלחתי לטעון. נסו שוב."}</div>`;
    }
  }

  function renderWindow() {
    const w = thread && left(thread.info.last_in_at);
    const el = $("window");
    el.classList.toggle("is-closed", !w);
    el.textContent = w
      ? `אפשר לענות עוד ${w.long}. תשובה בתוך 24 שעות מההודעה האחרונה שלהם היא בחינם.`
      : "עברו 24 שעות מההודעה האחרונה שלהם. אפשר לענות רק אחרי שיכתבו שוב (פנייה יזומה דורשת תבנית בתשלום).";
    $("reply").disabled = !w;
    $("send").disabled = !w || sending;
  }

  // ---------- שליחה ----------
  async function authHeaders() {
    const s = await getSession();
    return { Authorization: "Bearer " + (s ? s.access_token : "") };
  }

  async function send(e) {
    e.preventDefault();
    const ta = $("reply"), st = $("send-status");
    const text = ta.value.trim();
    if (!text || sending || !current) return;
    sending = true; $("send").disabled = true; st.classList.remove("is-error"); st.textContent = "שולח...";
    const to = current;
    try {
      const r = await fetch(FN, { method: "POST", headers: { ...(await authHeaders()), "Content-Type": "application/json" }, body: JSON.stringify({ action: "send", to, text }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        st.classList.add("is-error");
        st.textContent = j.error === "window" ? "לא נשלח: עברו 24 שעות מההודעה האחרונה שלהם." : j.error === "forbidden" ? "לא נשלח: צריך להתחבר מחדש." : "לא נשלח. נסו שוב בעוד רגע." + (j.detail ? " (" + j.detail + ")" : "");
        return;
      }
      ta.value = ""; grow();
      st.textContent = "נשלח ✓";
      setTimeout(() => { if (st.textContent === "נשלח ✓") st.textContent = ""; }, 4000);
      if (current === to) await openThread(to, { quiet: true });
      loadList();
    } catch (err) {
      st.classList.add("is-error"); st.textContent = "לא נשלח: אין חיבור לאינטרנט. נסו שוב.";
    } finally {
      sending = false; renderWindow();
    }
  }

  function grow() { const ta = $("reply"); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, 152) + "px"; }

  async function mark() {
    const btn = $("mark");
    btn.disabled = true;
    const { error } = await supabase.rpc("admin_inbox_mark", { p_wa_id: current, p_action: "handled" });
    btn.disabled = false;
    if (error) { $("send-status").textContent = "לא הצלחתי לסמן."; return; }
    await Promise.all([openThread(current, { quiet: true }), loadList()]);
  }

  // ---------- ניווט ----------
  function route() {
    const wa = decodeURIComponent(location.hash.slice(1));
    if (/^\d{8,15}$/.test(wa)) openThread(wa); else closeThread();
  }

  async function init() {
    const session = await getSession();
    if (!session) {
      try { sessionStorage.setItem("zkb_after_login", "inbox.html"); } catch (e) {}
      window.location.replace("login.html");
      return;
    }
    supabase = getSupabaseClient();
    const { data: isAdmin, error } = await supabase.rpc("is_admin");
    if (error || !isAdmin) { $("denied").hidden = false; revealPage(); return; }
    $("ib").hidden = false;
    revealPage();

    for (const b of document.querySelectorAll(".ib-tabs button")) {
      b.addEventListener("click", () => {
        filter = b.dataset.filter;
        for (const x of document.querySelectorAll(".ib-tabs button")) x.setAttribute("aria-pressed", String(x === b));
        loadList();
      });
    }
    $("search").addEventListener("input", renderList);
    $("convs").addEventListener("click", (e) => {
      const b = e.target.closest(".ib-conv");
      if (b) { fromList = true; location.hash = b.dataset.wa; }
    });
    $("back").addEventListener("click", () => { if (fromList) { fromList = false; history.back(); } else location.hash = ""; });
    $("msgs").addEventListener("click", (e) => { const b = e.target.closest(".ib-media-btn"); if (b) loadMedia(b); });
    $("compose").addEventListener("submit", send);
    $("reply").addEventListener("input", grow);
    $("reply").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(e); });
    $("mark").addEventListener("click", mark);
    window.addEventListener("hashchange", route);

    await loadList();
    route();
    // רענון: כל 20 שניות כשהדף פתוח לעין, ומיד כשחוזרים אליו
    setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 20000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  }
  function refresh() {
    loadList();
    if (current && !sending) openThread(current, { quiet: true });
    else if (thread) renderWindow();
  }

  if (location.protocol !== "file:") init();
</script>
</body>
